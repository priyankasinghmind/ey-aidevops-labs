image:
  repository: shipwave-api
  tag: "1.0"

api:
  replicaCount: 2
  service:
    type: ClusterIP
    port: 8000
    targetPort: 8000
  ingress:
    enabled: false
    className: ""
    host: shipwave.local
    path: /
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
  podSecurityContext:
    fsGroup: 10001
  secretName: shipwave-secrets
  secretKey: api-key

# The worker image is pre-built and shared by the trainer.
worker:
  image:
    repository: eylabacr31b021.azurecr.io/shared/shipwave-worker
    tag: "1.0"
